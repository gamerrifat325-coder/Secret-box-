<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d14">
<title>RTI News</title>
<style>
:root{--bg:#090d14;--panel:#111827;--line:#263244;--muted:#9ca3af;--blue:#3b82f6;--white:#f8fafc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font:15px Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}

header{height:62px;position:sticky;top:0;z-index:5;background:#0d1420;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.brand{font-size:25px;font-weight:900;letter-spacing:.3px}

/* Instagram-style heart notification icon */
.bell{
position:absolute;
right:16px;
background:none;
color:white;
width:42px;
height:42px;
display:flex;
align-items:center;
justify-content:center;
padding:0;
}
.bell svg{
width:22px;
height:22px;
fill:none;
stroke:currentColor;
stroke-width:2;
stroke-linecap:round;
stroke-linejoin:round;
}

main{max-width:680px;margin:auto;padding:14px 14px 90px;min-height:calc(100vh - 130px)}
h2{font-size:21px;margin:16px 0}
.muted{color:var(--muted);font-size:13px}
.empty{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 18px;text-align:center;margin:18px 0}
.empty h3{margin:0 0 8px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:14px 0}
.posthead{display:flex;align-items:center;gap:10px;padding:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:#263244;display:grid;place-items:center;overflow:hidden;flex-shrink:0;font-size:23px}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-weight:bold}
.media{width:100%;max-height:600px;object-fit:contain;background:#05070b;display:block}
.caption{padding:10px 13px;line-height:1.45;white-space:pre-wrap}
.actions{display:flex;gap:22px;padding:12px;border-top:1px solid var(--line)}
.action{background:none;color:#e5e7eb;padding:2px 0}
.action.liked{color:#fb7185}

nav{position:fixed;z-index:6;bottom:0;left:0;right:0;height:68px;padding-bottom:env(safe-area-inset-bottom);background:#0d1420;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}
nav button{background:none;color:#e5e7eb;min-width:55px;font-size:22px}
nav button span{display:block;font-size:10px;margin-top:2px;color:var(--muted)}
nav button.active,nav button.active span{color:var(--blue)}
nav .plus{background:var(--blue);border-radius:12px;width:44px;height:40px;font-size:29px;color:white}
nav .adsIcon{background:none;color:#e5e7eb;min-width:55px;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center}
nav .adsIcon svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.primary,.secondary{width:100%;padding:13px;border-radius:11px;margin-top:10px;background:var(--blue);color:white;font-weight:bold}
.secondary{background:#263244}
.profiletop{display:flex;align-items:center;gap:16px;margin:22px 0 12px}
.profiletop .avatar{width:88px;height:88px;font-size:38px}
.profiletop h2{margin:0 0 6px}
.bio{white-space:pre-wrap;line-height:1.45;margin:10px 0 16px}

.modal{display:none;position:fixed;inset:0;z-index:10;background:#000b;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:#101827;border-radius:22px 22px 0 0;padding:20px;width:100%;max-width:680px;max-height:92vh;overflow:auto}
.sheet h2{margin-top:0}

input,textarea{display:block;width:100%;background:#0b1220;color:white;border:1px solid #344155;border-radius:10px;padding:13px;margin:8px 0;outline:none}
textarea{min-height:90px;resize:vertical}
.notice{padding:14px;border-radius:12px;background:var(--panel);margin:10px 0}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.grid video,.grid img{width:100%;aspect-ratio:1;object-fit:cover;background:#111}
.small{font-size:12px;color:var(--muted)}
.filelabel{display:block;background:#263244;padding:13px;border-radius:11px;text-align:center;margin-top:10px;font-weight:bold}

@media(min-width:700px){
nav{max-width:680px;left:50%;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
</style>
</head>
<body>

<header>
<div class="brand">RTI News</div>

<button class="bell" onclick="showTab('Notifications')" aria-label="Notifications">
<svg viewBox="0 0 24 24">
<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
</svg>
</button>
</header>

<main id="app"></main>

<nav>
<button id="navHome" class="active" onclick="showTab('Home')">⌂<span>Home</span></button>
<button id="navReels" onclick="showTab('Reels')">▷<span>Reels</span></button>
<button class="plus" onclick="openCreate()" aria-label="Create">＋</button>

<button id="navAds" class="adsIcon" onclick="showTab('Ads')" aria-label="Advertisements">
<svg viewBox="0 0 24 24">
<circle cx="8" cy="19" r="1.5"/>
<circle cx="18" cy="19" r="1.5"/>
<path d="M2 3h2l2.5 12h12l3-9H5"/>
<path d="M8 7h10M8 10h9"/>
</svg>
<span>Ads</span>
</button>

<button id="navProfile" onclick="showTab('Profile')">◉<span>Profile</span></button>
</nav>

<div class="modal" id="createModal">
<div class="sheet">
<h2>Create on RTI News</h2>
<p class="muted">Choose what you want to upload.</p>
<textarea id="captionInput" placeholder="Write a caption (optional)..."></textarea>

<label class="filelabel">＋ Upload a Reel (Video)
<input id="reelFile" class="hidden" type="file" accept="video/*" onchange="uploadMedia(event,'reel')">
</label>

<label class="filelabel">▧ Upload a Post (Photo)
<input id="postFile" class="hidden" type="file" accept="image/*" onchange="uploadMedia(event,'post')">
</label>

<label class="filelabel">🛒 Upload an Advertisement
<input id="adFile" class="hidden" type="file" accept="image/*,video/*" onchange="uploadAdvertisement(event)">
</label>

<button class="secondary" onclick="closeModal('createModal')">Cancel</button>
<p class="small">Large videos may use significant browser storage.</p>
</div>
</div>

<div class="modal" id="editModal">
<div class="sheet">
<h2>Edit Profile</h2>
<div style="text-align:center">
<div id="editAvatar" class="avatar" style="width:86px;height:86px;margin:auto">👤</div>
</div>

<label class="filelabel">Change profile photo
<input class="hidden" id="avatarFile" type="file" accept="image/*" onchange="changeAvatar(event)">
</label>

<label class="muted">Name</label>
<input id="nameInput" maxlength="40" placeholder="Your name">

<label class="muted">Bio</label>
<textarea id="bioInput" maxlength="160" placeholder="Add a bio..."></textarea>

<button class="primary" onclick="saveProfile()">Save Profile</button>
<button class="secondary" onclick="closeModal('editModal')">Cancel</button>
</div>
</div>

<div class="modal" id="commentModal">
<div class="sheet">
<h2>Comments</h2>
<div id="commentList"></div>
<input id="commentInput" placeholder="Write a comment...">
<button class="primary" onclick="addComment()">Post Comment</button>
<button class="secondary" onclick="closeModal('commentModal')">Close</button>
</div>
</div>

<script>
const DB='rti_news_single_file_v1';

let state={
tab:'Home',
profile:{name:'RTI News User',bio:'',avatar:''},
posts:[],
ads:[],
notifications:[]
};

let commentPostId=null;

function load(){
try{
const s=JSON.parse(localStorage.getItem(DB)||'{}');
state={...state,...s};
if(!Array.isArray(state.ads))state.ads=[];
}catch(e){}
}

function save(){
try{
localStorage.setItem(DB,JSON.stringify(state));
}catch(e){
alert('Storage full. Please delete some large uploads or use smaller media.');
}
}

function esc(s=''){
return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function avatarHTML(uri,size=44){
return `<div class="avatar" style="width:${size}px;height:${size}px">${uri?`<img src="${uri}" alt="Profile photo">`:'👤'}</div>`;
}

function showTab(tab){
state.tab=tab;
document.querySelectorAll('nav button[id]').forEach(b=>b.classList.remove('active'));
const id='nav'+tab;
if(document.getElementById(id))document.getElementById(id).classList.add('active');
render();
}

function openCreate(){
document.getElementById('captionInput').value='';
document.getElementById('createModal').classList.add('show');
}

function closeModal(id){
document.getElementById(id).classList.remove('show');
}

function empty(title,sub,button=''){
return `<div class="empty"><h3>${esc(title)}</h3><div class="muted">${esc(sub)}</div>${button}</div>`;
}

function timeAgo(t){
return new Date(t).toLocaleString();
}

function renderPost(p){
const liked=p.likes.includes('me');
return `<article class="card">
<div class="posthead">${avatarHTML(p.avatar)}<div><div class="name">${esc(p.name)}</div><div class="small">${p.type==='reel'?'Reel':'News post'} · ${timeAgo(p.time)}</div></div></div>
${p.type==='reel'?`<video class="media" src="${p.src}" controls playsinline loop></video>`:`<img class="media" src="${p.src}" alt="News post">`}
${p.caption?`<div class="caption">${esc(p.caption)}</div>`:''}
<div class="actions"><button class="action ${liked?'liked':''}" onclick="toggleLike('${p.id}')">${liked?'♥':'♡'} ${p.likes.length} Like</button><button class="action" onclick="openComments('${p.id}')">◯ ${p.comments.length} Comment</button></div>
</article>`;
}

function renderAdvertisement(ad){
return `<article class="card">
<div class="posthead">
${avatarHTML(ad.avatar)}
<div>
<div class="name">${esc(ad.name)}</div>
<div class="small">Advertisement · ${timeAgo(ad.time)}</div>
</div>
</div>
${ad.type==='video'
?`<video class="media" src="${ad.src}" controls playsinline loop></video>`
:`<img class="media" src="${ad.src}" alt="Advertisement">`}
${ad.caption?`<div class="caption">${esc(ad.caption)}</div>`:''}
</article>`;
}

function render(){
const root=document.getElementById('app');
const p=state.profile;
const posts=state.posts;

if(state.tab==='Home'){
const list=posts.filter(x=>x.type==='post');
root.innerHTML='<h2>Latest News</h2>'+
(list.length?list.map(renderPost).join(''):empty('No posts yet','Be the first to share a news post.'));
return;
}

if(state.tab==='Reels'){
const list=posts.filter(x=>x.type==='reel');
root.innerHTML='<h2>Reels</h2>'+
(list.length?list.map(renderPost).join(''):empty('No reels yet. Upload your first reel!','Your uploaded videos will appear here.'))+
'<button class="primary" onclick="openCreate()">＋ Upload a Reel</button>';
return;
}

if(state.tab==='Ads'){
root.innerHTML='<h2>Advertisements</h2>'+
(state.ads.length
?state.ads.map(renderAdvertisement).join('')
:empty('No advertisements yet','There are currently no advertisements.'))+
'<button class="primary" onclick="openCreate()">＋ Upload an Advertisement</button>';
return;
}

if(state.tab==='Notifications'){
root.innerHTML='<h2>Notifications</h2>'+
(state.notifications.length
?state.notifications.map(n=>`<div class="notice"><b>${esc(n.title)}</b><p>${esc(n.message)}</p><div class="small">${timeAgo(n.time)}</div></div>`).join('')
:empty('No notifications yet','New activity will appear here.'));
return;
}

if(state.tab==='Profile'){
const mine=posts.filter(x=>x.owner==='me');
const myPosts=mine.filter(x=>x.type==='post');
const myReels=mine.filter(x=>x.type==='reel');

root.innerHTML=`
<div class="profiletop">${avatarHTML(p.avatar,88)}<div><h2>${esc(p.name||'RTI News User')}</h2><div class="muted">${mine.length} posts · ${myReels.length} reels</div></div></div>
${p.bio?`<div class="bio">${esc(p.bio)}</div>`:''}
<button class="secondary" onclick="openEdit()">Edit Profile</button>
<h2>Your Posts</h2>
${myPosts.length?myPosts.map(renderPost).join(''):empty('No posts yet','Your uploaded posts will appear here.')}
<h2>Your Reels</h2>
${myReels.length?myReels.map(renderPost).join(''):empty('No reels yet','Upload a reel to see it on your profile.')}`;
return;
}
}

function uploadMedia(ev,type){
const file=ev.target.files[0];
if(!file)return;

if(type==='reel'&&!file.type.startsWith('video/'))return alert('Please select a video.');
if(type==='post'&&!file.type.startsWith('image/'))return alert('Please select an image.');
if(file.size>80*1024*1024)return alert('Please choose a file smaller than 80 MB.');

const reader=new FileReader();

reader.onload=()=>{
const p={
id:Date.now().toString(),
owner:'me',
name:state.profile.name||'RTI News User',
avatar:state.profile.avatar||'',
type,
src:reader.result,
caption:document.getElementById('captionInput').value.trim(),
likes:[],
comments:[],
time:Date.now()
};

state.posts.unshift(p);
save();
closeModal('createModal');
ev.target.value='';
showTab(type==='reel'?'Reels':'Home');
};

reader.onerror=()=>alert('Could not read this file.');
reader.readAsDataURL(file);
}

function uploadAdvertisement(ev){
const file=ev.target.files[0];
if(!file)return;

if(!file.type.startsWith('image/')&&!file.type.startsWith('video/')){
return alert('Please select an image or video.');
}

if(file.size>80*1024*1024){
return alert('Please choose a file smaller than 80 MB.');
}

const reader=new FileReader();

reader.onload=()=>{
const ad={
id:Date.now().toString(),
name:state.profile.name||'RTI News User',
avatar:state.profile.avatar||'',
type:file.type.startsWith('video/')?'video':'image',
src:reader.result,
caption:document.getElementById('captionInput').value.trim(),
time:Date.now()
};

state.ads.unshift(ad);
save();
closeModal('createModal');
ev.target.value='';
showTab('Ads');
};

reader.onerror=()=>alert('Could not read this file.');
reader.readAsDataURL(file);
}

function openEdit(){
document.getElementById('nameInput').value=state.profile.name||'';
document.getElementById('bioInput').value=state.profile.bio||'';
document.getElementById('editAvatar').innerHTML=state.profile.avatar
?`<img src="${state.profile.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
:'👤';
document.getElementById('editModal').classList.add('show');
}

function changeAvatar(ev){
const f=ev.target.files[0];
if(!f)return;
if(!f.type.startsWith('image/'))return alert('Choose an image.');

const r=new FileReader();
r.onload=()=>{
state.profile.avatar=r.result;
document.getElementById('editAvatar').innerHTML=`<img src="${r.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
};
r.readAsDataURL(f);
}

function saveProfile(){
state.profile.name=document.getElementById('nameInput').value.trim()||'RTI News User';
state.profile.bio=document.getElementById('bioInput').value.trim();

state.posts.forEach(p=>{
if(p.owner==='me'){
p.name=state.profile.name;
p.avatar=state.profile.avatar||'';
}
});

save();
closeModal('editModal');
render();
}

function toggleLike(id){
const p=state.posts.find(x=>x.id===id);
if(!p)return;

const i=p.likes.indexOf('me');

if(i>=0){
p.likes.splice(i,1);
}else{
p.likes.push('me');
if(p.owner!=='me'){
state.notifications.unshift({
title:'New like',
message:'Someone liked your post.',
time:Date.now()
});
}
}

save();
render();
}

function openComments(id){
commentPostId=id;
const p=state.posts.find(x=>x.id===id);

document.getElementById('commentList').innerHTML=
p.comments.length
?p.comments.map(c=>`<div class="notice"><b>${esc(c.name)}</b><p>${esc(c.text)}</p></div>`).join('')
:'<p class="muted">No comments yet.</p>';

document.getElementById('commentInput').value='';
document.getElementById('commentModal').classList.add('show');
}

function addComment(){
const text=document.getElementById('commentInput').value.trim();
if(!text)return;

const p=state.posts.find(x=>x.id===commentPostId);
if(!p)return;

p.comments.push({
name:state.profile.name||'RTI News User',
text
});

save();
openComments(commentPostId);
document.getElementById('commentInput').value='';
}

load();
render();
</script>
</body>
</html>
